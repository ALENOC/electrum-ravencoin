name: Ops tag 1.3.0rc3

on:
  push:
    branches:
      - ops/rc3-tagging
    paths:
      - ".github/workflows/ops-tag-1.3.0rc3.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create immutable RC3 tag on validated master commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: cf9dc6ab87cea417eb027fdda736bbf5c4fd479f
          TAG: 1.3.0rc3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:electrum/version.py" | grep -F 'ELECTRUM_VERSION = "1.3.0rc3"' | wc -l)" -eq 1
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git tag "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"
