name: Single trusted operator migration

on:
  push:
    branches:
      - feature/dynamic-electrumx-server-list

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/dynamic-electrumx-server-list
          fetch-depth: 0
      - name: Apply trust-model migration
        shell: python
        run: |
          import pathlib
          import re

          root = pathlib.Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          def replace_func(path, name, replacement):
              p = root / path
              text = p.read_text(encoding='utf-8')
              pattern = rf'(?ms)^    (?:async )?def {re.escape(name)}\(.*?(?=^    (?:async )?def |^class |\Z)'
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f'function {name} not found in {path}')
              text = text[:match.start()] + replacement.rstrip() + '\n\n' + text[match.end():]
              p.write_text(text, encoding='utf-8')

          # Core authorization model: one explicitly trusted operator is enough
          # for normal Electrum operation. Multiple trusted operators are still
          # all compared, and any conflict blocks.
          replace_once(
              'electrum/network.py',
              '    interface.ready, the policy-conforming backend claim, and\n'
              '    chain_validation_state == VERIFIED are each necessary but not sufficient\n'
              '    for trusted chain-dependent actions.  A single server is never allowed to\n'
              '    promote its own post-checkpoint view to trusted wallet state. Broadcasts\n'
              '    and verified reads additionally require independent agreement across at\n'
              '    least MIN_INDEPENDENT_OPERATOR_GROUPS distinct, individually-validated\n'
              '    operators.\n',
              '    interface.ready, the policy-conforming backend claim, chain validation,\n'
              '    and an authenticated operatorGroup are required for trusted chain-dependent\n'
              '    actions. One trusted operator is sufficient for normal Electrum operation.\n'
              '    If multiple trusted operator groups are connected, every group is compared\n'
              '    and any chain disagreement still fails closed instead of being ignored.\n'
          )
          replace_once(
              'electrum/network.py',
              '#: A single operator, however many endpoints it runs, is not independent\n'
              '#: consensus. Two is the minimum for "independent agreement" to mean\n'
              '#: anything; this is deliberately not configurable from a remote source.\n'
              'MIN_INDEPENDENT_OPERATOR_GROUPS = 2\n',
              '#: Minimum number of authenticated, individually validated operator groups\n'
              '#: required for normal wallet operation. One preserves the traditional\n'
              '#: Electrum availability model. When two or more trusted groups are online,\n'
              '#: the authorization logic still compares all of them and fails closed on\n'
              '#: disagreement. This threshold is not remotely configurable.\n'
              'MIN_INDEPENDENT_OPERATOR_GROUPS = 1\n'
              'MULTI_OPERATOR_ASSURANCE_GROUPS = 2\n'
          )
          replace_once(
              'electrum/network.py',
              '        # Freshness: agreement over an old window must never stand in for\n'
              '        # agreement about the present. The bar is the best tip ANY connected\n'
              '        # interface reports (server-reported tips only ever raise the bar,\n'
              '        # which can block writes -- fail closed -- but never lower it).\n'
              '        best_tip = max(self._connected_tip_heights())\n',
              '        # Freshness is measured only across authenticated/validated operator\n'
              '        # representatives. An unsigned discovery endpoint must not be able to\n'
              '        # denial-of-service a single trusted operator by advertising a fake tip.\n'
              '        # With multiple trusted groups, a taller conflicting/stale witness still\n'
              '        # raises the bar and can block, as intended.\n'
              '        best_tip = max(heights)\n'
          )
          replace_once(
              'electrum/network.py',
              '            return _("Broadcast blocked: insufficient independent server consensus.\\n"\n'
              '                     "At least {n} independently-operated, individually verified servers "\n'
              '                     "are required before this wallet will send a transaction.")\\\n'
              '                .format(n=MIN_INDEPENDENT_OPERATOR_GROUPS)\n',
              '            return _("Broadcast blocked: no trusted, individually verified server operator "\n'
              '                     "is currently available. At least {n} trusted operator group is required "\n'
              '                     "before this wallet will send a transaction.")\\\n'
              '                .format(n=MIN_INDEPENDENT_OPERATOR_GROUPS)\n'
          )
          replace_once(
              'electrum/network.py',
              '            f"{len(groups)} independent operator groups agree on all "\n'
              '            f"{RECENT_AGREEMENT_WINDOW} recent blocks through height {min_height}",\n',
              '            (f"{len(groups)} trusted operator group(s) validated on all "\n'
              '             f"{RECENT_AGREEMENT_WINDOW} recent blocks through height {min_height}"),\n'
          )

          # Runtime registry documentation: a signed second operator improves
          # assurance, but is no longer required merely to use the wallet.
          replace_once(
              'electrum/server_list_updater.py',
              'With the quorum threshold still at two independent operators, sensitive actions\n'
              'therefore fail closed until a second operator is present in a valid signed\n'
              'registry.\n',
              'One authenticated/validated operator is sufficient for normal wallet operation.\n'
              'A valid signed registry can add independent operator groups dynamically; when\n'
              'multiple trusted groups are online, disagreement still fails closed and agreement\n'
              'provides stronger multi-operator assurance.\n'
          )

          tests = 'electrum/tests/test_write_authorization.py'
          replace_once(
              tests,
              '"""F2 write-authorization gate: independent-operator consensus for broadcast.\n\n'
              'interface.ready, the policy-conforming backend claim, and\n'
              'chain_validation_state == VERIFIED are each necessary but not sufficient for\n'
              'trusted chain-dependent state. A single server is still one operator. The\n'
              'same independent recent-chain evidence now gates both broadcast and promotion\n'
              'of server-provided state to SPV-verified wallet state.\n',
              '"""Trusted-operator authorization for broadcast and verified reads.\n\n'
              'A single authenticated, individually validated operator is sufficient for normal\n'
              'Electrum operation. If multiple trusted operator groups are online, their recent\n'
              'chain windows must agree; disagreement still fails closed. Unknown/discovery-only\n'
              'servers never become trusted merely because they are connected.\n'
          )

          replace_func(tests, 'test_single_operator_group_is_insufficient', '''    def test_single_trusted_operator_group_authorizes(self):
              """One authenticated/validated operator is enough for normal operation."""
              a = _safe_interface("cipig-a.example")
              b = _safe_interface("cipig-b.example")
              c = _safe_interface("cipig-c.example")
              net = _network_with_interfaces(a, b, c)
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  auth = net.get_write_authorization()
              self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)
              self.assertEqual(1, auth.operator_group_count)''')

          replace_func(tests, 'test_unknown_operator_endpoint_does_not_count_toward_diversity', '''    def test_unknown_operator_endpoint_does_not_count_but_cannot_block_trusted_operator(self):
              """Discovery-only endpoints neither add trust nor deny service to a trusted one."""
              known = _safe_interface("cipig-a.example")
              unknown = _safe_interface("no-metadata.example")
              net = _network_with_interfaces(known, unknown)
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  auth = net.get_write_authorization()
              self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)
              self.assertEqual(1, auth.operator_group_count)''')

          replace_func(tests, 'test_oneserver_mode_does_not_bypass_the_gate', '''    def test_oneserver_mode_uses_the_same_single_trusted_operator_rule(self):
              a = _safe_interface("cipig-a.example")
              net = _network_with_interfaces(a)
              net.oneserver = True
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  auth = net.get_write_authorization()
              self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)
              self.assertEqual(1, auth.operator_group_count)''')

          replace_func(tests, 'test_single_fabricated_chain_operator_cannot_authorize_broadcast', '''    async def test_single_trusted_operator_can_authorize_broadcast(self):
              """Compatibility choice: one trusted operator can relay after all live gates pass.

              This deliberately restores the traditional Electrum single-server trust assumption;
              compromise of that sole trusted operator is residual risk, not hidden consensus.
              """
              trusted = self._live(_safe_interface("cipig-a.example"))
              net = _network_with_interfaces(trusted)
              tx = self._fake_tx()
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  await net.broadcast_transaction(tx, timeout=5)
              trusted.session.send_request.assert_awaited_once_with(
                  'blockchain.transaction.broadcast', [tx.serialize()], timeout=5)''')

          replace_func(tests, 'test_two_endpoints_same_malicious_operator_cannot_authorize_broadcast', '''    async def test_multiple_endpoints_same_trusted_operator_still_count_as_one(self):
              a = self._live(_safe_interface("cipig-a.example"))
              b = self._live(_safe_interface("cipig-b.example"))
              net = _network_with_interfaces(a, b)
              tx = self._fake_tx()
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  auth = net.get_write_authorization()
                  self.assertEqual(1, auth.operator_group_count)
                  self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)
                  await net.broadcast_transaction(tx, timeout=5)
              total = a.session.send_request.await_count + b.session.send_request.await_count
              self.assertEqual(1, total)''')

          replace_func(tests, 'test_directory_listing_alone_does_not_authorize_broadcast', '''    async def test_unvalidated_directory_entry_does_not_add_trust(self):
              listed_but_unvalidated = self._live(_safe_interface("independent.example", safe=False))
              trusted = self._live(_safe_interface("cipig-a.example"))
              net = _network_with_interfaces(trusted, listed_but_unvalidated)
              tx = self._fake_tx()
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  auth = net.get_write_authorization()
                  self.assertEqual(1, auth.operator_group_count)
                  self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)
                  await net.broadcast_transaction(tx, timeout=5)
              trusted.session.send_request.assert_awaited_once()''')

          replace_func(tests, 'test_ready_safe_verified_alone_is_not_sufficient_comment_regression', '''    async def test_ready_safe_verified_requires_authenticated_operator_group(self):
              """Live validation alone is insufficient if the endpoint has no trusted identity."""
              solo = self._live(_safe_interface("no-metadata.example"))
              net = _network_with_interfaces(solo)
              tx = self._fake_tx()
              with patch.object(constants.net, "DEFAULT_SERVERS", FIXTURE_SERVERS):
                  with self.assertRaises(BroadcastNotAuthorized) as caught:
                      await net.broadcast_transaction(tx, timeout=5)
              self.assertEqual(
                  WriteAuthorizationState.INSUFFICIENT_OPERATOR_DIVERSITY,
                  caught.exception.authorization.state,
              )
              solo.session.send_request.assert_not_called()''')

          # Keep the security note explicit: the original one-malicious-server
          # mitigation is now optional multi-operator assurance, not a hard gate.
          replace_once(
              'SECURITY_REMEDIATION_2026-08-19.md',
              'The single-malicious-ElectrumX path is closed instead by extending the existing\n'
              'independent-operator chain-consensus boundary from transaction broadcast to\n'
              'promotion of remote data into verified wallet state. The exact serving\n'
              'interface must match the agreed chain, the claimed height must be no newer than\n'
              'the agreed witness tip, authorization is rechecked after the proof request,\n'
              'and unverified positive-height outputs/spends are quarantined from balances and\n'
              'coin selection. Existing post-checkpoint verification caches are demoted once\n'
              'and revalidated. Post-KAWPOW heights also cannot downgrade to legacy hashing by\n'
              'supplying an old timestamp.\n',
              'The client keeps the independent-operator comparison machinery, but restores the\n'
              'traditional Electrum availability model: one authenticated, individually validated\n'
              'operator is sufficient for normal reads, SPV promotion, and broadcast. If two or\n'
              'more trusted operator groups are online, their recent-chain windows must agree and\n'
              'any conflict fails closed. This means compromise of the sole trusted operator is an\n'
              'explicit residual risk; the client is not a full Ravencoin consensus verifier.\n'
              'Unverified positive-height outputs/spends remain quarantined until the serving\n'
              'trusted interface passes the read authorization gates, and post-KAWPOW heights\n'
              'still cannot downgrade to legacy hashing via timestamp manipulation.\n'
          )
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electrum/network.py electrum/server_list_updater.py electrum/tests/test_write_authorization.py SECURITY_REMEDIATION_2026-08-19.md
          git diff --cached --check
          git commit -m "network: allow one trusted operator for normal wallet use"
          git push origin HEAD:feature/dynamic-electrumx-server-list
