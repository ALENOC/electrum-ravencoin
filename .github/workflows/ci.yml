name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate-legacy-two-operator-tests:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/dynamic-electrumx-server-list'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/dynamic-electrumx-server-list
          fetch-depth: 0

      - name: Update legacy regression expectations
        shell: python
        run: |
          import pathlib
          import re

          path = pathlib.Path('electrum/tests/test_recent_agreement_relay.py')
          text = path.read_text(encoding='utf-8')

          def replace_method(name, lines, *, async_=False):
              global text
              pattern = rf'(?ms)^    (?:async )?def {re.escape(name)}\(self\):.*?(?=^    (?:async )?def |^class |\Z)'
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f'method not found: {name}')
              header = '    ' + ('async ' if async_ else '') + f'def {name}(self):\n'
              body = '\n'.join(('        ' + line) if line else '' for line in lines)
              text = text[:match.start()] + header + body.rstrip() + '\n\n' + text[match.end():]

          replace_method('test_H3_stale_main_interface_does_not_lower_freshness_bar', [
              '"""Discovery-only endpoints cannot raise the trusted freshness bar."""',
              'stale_a = make_iface("a1.example", height=H - 500, tip=H - 500)',
              'stale_b = make_iface("b1.example", height=H - 500, tip=H - 500)',
              'fresh_unknown = make_iface("unknown.example", height=H, tip=H)',
              'self.assertEqual(',
              '    WriteAuthorizationState.AUTHORIZED,',
              '    self._auth(make_net(stale_a, stale_b, fresh_unknown)).state,',
              ')',
          ])
          replace_method('test_J5_fractional_tip_cannot_lower_freshness_bar', [
              '"""An untrusted fractional tip cannot denial-of-service trusted operators."""',
              'a = make_iface("a1.example", height=H, tip=H)',
              'b = make_iface("b1.example", height=H, tip=H)',
              'spam = make_iface("unknown.example", height=H, tip=H + 2.5)',
              'self.assertEqual(',
              '    WriteAuthorizationState.AUTHORIZED,',
              '    self._auth(make_net(a, b, spam)).state,',
              ')',
          ])
          replace_method('test_J3_connected_height_exception_does_not_crash_gate', [
              '"""A non-trusted endpoint with broken height evidence is ignored by trust decisions."""',
              'a = make_iface("a1.example")',
              'b = make_iface("b1.example")',
              'spam = make_iface("unknown.example", height=H + 500, tip=H + 500)',
              'spam.blockchain.height = Mock(side_effect=RuntimeError("boom"))',
              'self.assertEqual(',
              '    WriteAuthorizationState.AUTHORIZED,',
              '    self._auth(make_net(a, b, spam)).state,',
              ')',
          ])
          replace_method('test_L_two_endpoints_of_one_operator_are_one_group', [
              'a1 = make_iface("a1.example")',
              'a2 = make_iface("a2.example")',
              'auth = self._auth(make_net(a1, a2))',
              'self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)',
              'self.assertEqual(1, auth.operator_group_count)',
          ])
          replace_method('test_M_known_plus_unknown_manual_is_insufficient', [
              'a = make_iface("a1.example")',
              'unknown = make_iface("not-listed.example")',
              'auth = self._auth(make_net(a, unknown))',
              'self.assertEqual(WriteAuthorizationState.AUTHORIZED, auth.state)',
              'self.assertEqual(1, auth.operator_group_count)',
          ])
          replace_method('test_3_relay_target_disconnects_before_broadcast', [
              'a, b, net = self._net_ab()',
              'a.got_disconnected.set()',
              'await self._broadcast(net)',
              'self.assertEqual(0, a.session.send_request.await_count)',
              'b.session.send_request.assert_awaited_once()',
          ], async_=True)
          replace_method('test_4_relay_target_not_ready_before_broadcast', [
              '"""If A is not ready, the still-trusted B operator can relay normally."""',
              'a, b, net = self._net_ab()',
              'net.interface = b',
              'a.ready = Mock()',
              'a.ready.done = Mock(return_value=False)',
              'await self._broadcast(net)',
              'self.assertEqual(0, a.session.send_request.await_count)',
              'b.session.send_request.assert_awaited_once()',
          ], async_=True)
          replace_method('test_5_relay_target_loses_safe_backend_state', [
              'a, b, net = self._net_ab()',
              'a.ravencoin_backend_state = BackendEligibilityState.CHAIN_CONFLICT',
              'a.chain_validation_state = "CONFLICT"',
              'await self._broadcast(net)',
              'self.assertEqual(0, a.session.send_request.await_count)',
              'b.session.send_request.assert_awaited_once()',
          ], async_=True)
          replace_method('test_original_f2_single_operator_still_blocked', [
              '"""Residual risk is explicit: one trusted but compromised operator can relay."""',
              'evil = make_iface("evil1.example", chain=forked_chain(3_900_000), live=True)',
              'net = make_net(evil, main=evil)',
              'await self._broadcast(net)',
              'evil.session.send_request.assert_awaited_once()',
          ], async_=True)

          text = text.replace(
              'tip, plus a freshness bound against the best tip any connected interface\n   reports.',
              'tip, plus a freshness bound across authenticated trusted operator groups.'
          )
          path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Commit updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m compileall -q electrum/tests/test_recent_agreement_relay.py
          git add electrum/tests/test_recent_agreement_relay.py
          git diff --cached --check
          git commit -m "tests: align relay security cases with single trusted operator"
          git push origin HEAD:feature/dynamic-electrumx-server-list
