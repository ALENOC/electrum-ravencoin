name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  align-trust-model-wording:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/dynamic-electrumx-server-list'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/dynamic-electrumx-server-list
          fetch-depth: 0

      - name: Update comments and GUI wording
        shell: python
        run: |
          import pathlib

          p = pathlib.Path('electrum/network.py')
          text = p.read_text(encoding='utf-8')

          def repl(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected text: {old[:120]!r}')
              text = text.replace(old, new, 1)

          repl(
              '    #: Fewer than MIN_INDEPENDENT_OPERATOR_GROUPS distinct, individually\n'
              '    #: validated operator groups are currently available. This is the\n'
              '    #: default state with the shipped server list, which is a single\n'
              '    #: operator (rvn4lyfe.com plus its .onion mirror) -- broadcast is\n'
              '    #: blocked until a genuinely independent second operator is connected.\n',
              '    #: Fewer than MIN_INDEPENDENT_OPERATOR_GROUPS authenticated, individually\n'
              '    #: validated operator groups are currently available. With the threshold\n'
              '    #: at one, this means no trusted operator is currently usable.\n'
          )
          repl(
              '    #: At least two independent operator groups are validated, but the\n'
              '    #: shortest validated tip among them is too far behind the best tip any\n'
              '    #: connected interface reports. Their agreement covers only the past;\n'
              '    #: it is stale evidence for a write that depends on the present chain.\n',
              '    #: Multiple trusted operator groups are validated, but the shortest\n'
              '    #: trusted tip lags the best trusted tip beyond the allowed bound. Their\n'
              '    #: common evidence is stale for a chain-dependent action.\n'
          )
          repl(
              '#: How far any witness group\'s validated tip may lag behind the best tip\n'
              '#: observed by ANY connected interface before its evidence counts as stale.\n'
              '#: Blocks above the shortest witness tip cannot be cross-checked between\n'
              '#: witnesses (no one else has seen them yet), so this bound is what caps a\n'
              '#: taller fabricated chain: a malicious group can claim at most this many\n'
              '#: unseen blocks above the honest frontier before freshness fails closed.\n',
              '#: How far the shortest trusted operator tip may lag behind the best trusted\n'
              '#: operator tip before multi-operator evidence counts as stale. Discovery-only\n'
              '#: endpoints are intentionally excluded: unauthenticated metadata must not be\n'
              '#: able to denial-of-service the sole trusted operator by advertising a fake tip.\n'
          )
          repl(
              '    """Best-effort operator identity for a server, from the shipped server\n'
              '    list only (constants.net.DEFAULT_SERVERS). A server that is not in that\n'
              '    list -- including any the user added manually -- has no known operator\n'
              '    identity here, and returns None. None must never be treated as its own\n'
              '    independent group: an absent identity is not evidence of independence\n'
              '    (server-policy: unknown/missing operatorGroup must not silently create\n'
              '    a new independent group).\n'
              '    """\n',
              '    """Return the authenticated operator identity from the current effective\n'
              '    server registry/directory. Runtime signed-registry updates replace\n'
              '    ``constants.net.DEFAULT_SERVERS`` atomically, so this lookup automatically\n'
              '    follows accepted trust updates. Unknown/manual/discovery-only servers return\n'
              '    None; absence of identity must never manufacture a trusted operator group.\n'
              '    """\n'
          )
          repl(
              '        if state == WriteAuthorizationState.INSUFFICIENT_OPERATOR_DIVERSITY:\n'
              '            return _("Broadcast blocked: insufficient independent server consensus.\\n"\n'
              '                     "At least {n} independently-operated, individually verified servers "\n'
              '                     "are required before this wallet will send a transaction.")\\\n'
              '                .format(n=MIN_INDEPENDENT_OPERATOR_GROUPS)\n',
              '        if state == WriteAuthorizationState.INSUFFICIENT_OPERATOR_DIVERSITY:\n'
              '            return _("Broadcast blocked: no trusted ElectrumX operator is currently "\n'
              '                     "available and individually verified. Connect to a trusted server "\n'
              '                     "and let backend/chain validation complete before retrying.")\n'
          )
          repl(
              '        identical canonical block hash at every height of a bounded window\n'
              '        ending at the shortest validated tip, with every witness group\'s tip\n'
              '        current within MAX_WITNESS_TIP_LAG of the best tip any connected\n'
              '        interface reports. On success the result is a capability binding the\n',
              '        identical canonical block hash at every height of a bounded window\n'
              '        ending at the shortest validated tip. With multiple trusted groups,\n'
              '        each trusted tip must remain within MAX_WITNESS_TIP_LAG of the best\n'
              '        trusted tip. On success the result is a capability binding the\n'
          )
          repl(
              '                f"only {len(groups)} independent operator group(s) verified; "\n'
              '                f"at least {MIN_INDEPENDENT_OPERATOR_GROUPS} are required for writes",\n',
              '                f"only {len(groups)} trusted operator group(s) verified; "\n'
              '                f"at least {MIN_INDEPENDENT_OPERATOR_GROUPS} are required for writes",\n'
          )

          p.write_text(text, encoding='utf-8')

      - name: Commit wording cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m compileall -q electrum/network.py
          git add electrum/network.py
          git diff --cached --check
          git commit -m "network: clarify single trusted-operator security model"
          git push origin HEAD:feature/dynamic-electrumx-server-list
