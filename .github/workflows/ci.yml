name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Safety and contract tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install native crypto dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecp256k1-1

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[tests]"
          python -m pip install pytest==8.3.5

      - name: Focused safety and backend contract tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            electrum/tests/test_core_safety_policy.py \
            electrum/tests/test_core_safety_directory.py \
            electrum/tests/test_ravencoin_backend.py \
            electrum/tests/test_interface.py \
            electrum/tests/test_blockchain.py::TestKawpowNHeightValidation

      - name: Compile checks
        run: python -m compileall -q electrum
