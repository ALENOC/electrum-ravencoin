name: Ops dispatch Release build 1.3.0rc3

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ops-dispatch-release-rc3.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch release workflow on tag 1.3.0rc3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
            -f ref='1.3.0rc3'
